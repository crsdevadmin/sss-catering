<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Pre-order festival sweet boxes, savoury boxes, hampers and catering from SSS Catering.">
<meta name="theme-color" content="#123A2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SSS Catering">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{color-scheme:light dark}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>SSS Catering Festival Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F1E7; --stage:#E7E3D5;
  --surface:#FFFFFF; --surface-2:#F5F2E8; --surface-3:#EAE5D6;
  --line:#DCD6C4; --line-soft:#E9E4D6;
  --ink:#181C17; --ink-2:#57604F; --ink-3:#8B9083;
  --brand:#123A2B; --brand-2:#1C5340; --on-brand:#F3F1E7;
  --accent:#D4820F; --on-accent:#231602;
  --alert:#B03227; --alert-bg:#FBEDEA;
  --ok:#2C7A4E; --ok-bg:#E9F3EC;
  --warn:#B87709; --warn-bg:#FBF1DF;
  --shadow:0 1px 2px rgba(24,28,23,.05), 0 8px 24px rgba(24,28,23,.07);
  --shadow-lg:0 24px 60px rgba(18,58,43,.22), 0 4px 12px rgba(18,58,43,.10);
  --nav-on:#123A2B;
  --r:14px; --r-lg:20px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151310; --stage:#0E0D0B;
    --surface:#1E1B16; --surface-2:#262118; --surface-3:#2F2919;
    --line:#38301F; --line-soft:#2B251A;
    --ink:#F0EBDE; --ink-2:#B3AB99; --ink-3:#807A6C;
    --brand:#2A6A50; --brand-2:#348063; --on-brand:#F0EBDE;
    --accent:#EFA738; --on-accent:#1E1200;
    --alert:#E4776A; --alert-bg:#2E1B18;
    --ok:#63BC88; --ok-bg:#16281D;
    --warn:#E0A445; --warn-bg:#2C2213;
    --nav-on:#EFA738;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 24px 60px rgba(0,0,0,.6), 0 4px 12px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151310; --stage:#0E0D0B;
  --surface:#1E1B16; --surface-2:#262118; --surface-3:#2F2919;
  --line:#38301F; --line-soft:#2B251A;
  --ink:#F0EBDE; --ink-2:#B3AB99; --ink-3:#807A6C;
  --brand:#2A6A50; --brand-2:#348063; --on-brand:#F0EBDE;
  --accent:#EFA738; --on-accent:#1E1200;
  --alert:#E4776A; --alert-bg:#2E1B18;
  --ok:#63BC88; --ok-bg:#16281D;
  --warn:#E0A445; --warn-bg:#2C2213;
  --nav-on:#EFA738;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 24px 60px rgba(0,0,0,.6), 0 4px 12px rgba(0,0,0,.4);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--stage); color:var(--ink);
  font-family:Karla,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:Fraunces,Georgia,serif;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* ---------- app shell ---------- */
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative}
.appbar{order:1} .subbar{order:2} .scroll{order:3} .nav{order:4}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{max-width:640px;margin:0 auto;padding-bottom:8px}

@media (min-width:760px){
  .appbar{padding:16px 24px 14px}
  .subbar{padding:8px 24px}
}
/* ---------- app header ---------- */
.appbar{
  display:flex;align-items:center;gap:10px;padding:14px 16px 12px;
  background:var(--brand);color:var(--on-brand);flex:none;
}
.appbar .logo{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1}
.appbar .logo small{display:block;font-family:Karla,sans-serif;font-weight:600;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.72;margin-top:3px}
.appbar .sp{flex:1}
.icobtn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.10);position:relative;color:var(--on-brand)}
.icobtn:hover{background:rgba(255,255,255,.2)}
.icobtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge[hidden]{display:none!important}
.badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;display:grid;place-items:center}
.subbar{display:flex;align-items:center;gap:6px;padding:7px 16px;background:var(--brand-2);color:var(--on-brand);font-size:11px;flex:none}
.subbar svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.subbar b{font-weight:700}
.subbar button{margin-left:auto;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.85;text-decoration:underline;text-underline-offset:3px}

/* ---------- page header (inner screens) ---------- */
.phead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:20}
.phead h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghost{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.ghost:hover{border-color:var(--accent)}
.ghost svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- generic ---------- */
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.sechead{display:flex;align-items:baseline;gap:8px;padding:20px 16px 10px}
.sechead h3{font-size:16.5px;flex:1}
.sechead a{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;cursor:pointer}
.muted{color:var(--ink-2);font-size:13px}
.tiny{font-size:11.5px;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.divider{height:1px;background:var(--line-soft);margin:4px 0}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.pill.open{background:var(--ok-bg);color:var(--ok)}
.pill.soon{background:var(--warn-bg);color:var(--warn)}
.pill.closed{background:var(--alert-bg);color:var(--alert)}
.pill.plan{background:var(--surface-3);color:var(--ink-2)}
.pill.dot::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--brand);color:var(--on-brand);width:100%;transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.985)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.out{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.out:hover{border-color:var(--accent);filter:none}
.btn[disabled]{background:var(--surface-3);color:var(--ink-3);cursor:not-allowed;filter:none;transform:none}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:10px;width:auto}

/* ---------- festival art ---------- */
.art{
  position:relative;overflow:hidden;
  background-color:hsl(var(--fh) 58% 22%);
  background-image:
    radial-gradient(circle at 50% 50%, hsl(var(--fh) 92% 80% / .85) 0 1.9px, transparent 2.4px),
    radial-gradient(circle at 50% 50%, hsl(var(--fh) 85% 66% / .32) 0 8px, transparent 9px),
    conic-gradient(from 22deg at 50% 50%, hsl(var(--fh) 76% 58% / .24) 0 12.5%, transparent 12.5% 25%, hsl(var(--fh) 76% 58% / .24) 25% 37.5%, transparent 37.5% 50%, hsl(var(--fh) 76% 58% / .24) 50% 62.5%, transparent 62.5% 75%, hsl(var(--fh) 76% 58% / .24) 75% 87.5%, transparent 87.5%),
    repeating-linear-gradient(45deg, hsl(var(--fh) 45% 35% / .16) 0 4px, transparent 4px 11px),
    linear-gradient(155deg, hsl(var(--fh) 54% 31%), hsl(var(--fh) 63% 15%));
  background-size:22px 22px, 66px 66px, 66px 66px, auto, auto;
  background-position:0 0, 33px 33px, 0 0, 0 0, 0 0;
}
.art .glyph{position:absolute;inset:0;display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-size:44px;color:#fff;opacity:.82;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.art.sm{height:78px;width:78px;border-radius:11px;flex:none}
.art.sm .glyph{font-size:30px}

/* ---------- banner ---------- */
.banner{margin:16px;border-radius:var(--r-lg);overflow:hidden;position:relative;box-shadow:var(--shadow);min-height:168px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to top, rgba(10,20,12,.86) 12%, rgba(10,20,12,.15) 70%)}
.banner>*{position:relative;z-index:1}
.banner .kicker{color:#F6D89B;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.banner h2{color:#fff;font-size:23px;line-height:1.12;margin:6px 0 10px;max-width:15ch}
.banner .btn{width:auto;align-self:flex-start;padding:9px 16px}

/* ---------- festival cards ---------- */
.fcard{display:flex;gap:12px;padding:12px;align-items:center;text-align:left}
.fcard .body{flex:1;min-width:0}
.fcard h4{font-size:15px;margin-bottom:2px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.fbig{width:212px;flex:none;scroll-snap-align:start;border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column}
.fbig .art{height:104px}
.fbig .b{padding:11px 12px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.fbig h4{font-size:15px}

/* ---------- product cards ---------- */
.pcard{display:flex;gap:12px;padding:12px;width:100%;text-align:left;align-items:stretch}
.pcard .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pcard h4{font-size:15px;line-height:1.25}
.pcard .price{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:16px}
.pcard .meta{font-size:11.5px;color:var(--ink-3)}
.pcard .desc{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px}

.tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;position:sticky;top:57px;background:var(--bg);z-index:19;border-bottom:1px solid var(--line-soft)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--line);white-space:nowrap;flex:none}
.tab[aria-selected="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

/* ---------- product detail ---------- */
.hero{height:196px;position:relative}
.hero .back{position:absolute;top:12px;left:12px;z-index:2;background:rgba(255,255,255,.92);color:#181C17;border:0}
.hero .actions{position:absolute;top:12px;right:12px;z-index:2;display:flex;gap:7px}
.hero .actions .ghost{background:rgba(255,255,255,.92);color:#181C17;border:0}
.optgrp{display:flex;flex-wrap:wrap;gap:7px}
.opt{padding:8px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.inside{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.inside li{display:flex;gap:9px;font-size:13.5px;color:var(--ink-2);align-items:flex-start}
.inside li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent);margin-top:6px;flex:none;transform:rotate(45deg)}
.notice{border-radius:12px;padding:11px 13px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start;line-height:1.45}
.notice svg{width:15px;height:15px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.bad{background:var(--alert-bg);color:var(--alert)}
.notice.good{background:var(--ok-bg);color:var(--ok)}
.notice b{color:inherit}

.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.stepper button{width:36px;height:38px;display:grid;place-items:center;font-size:17px;font-weight:700;color:var(--ink-2)}
.stepper button:hover{background:var(--surface-2);color:var(--accent)}
.stepper span{min-width:30px;text-align:center;font-weight:700;font-size:14px}

.sticky{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;z-index:20;box-shadow:0 -6px 20px rgba(24,28,23,.06)}

/* ---------- forms ---------- */
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.inp{width:100%;padding:11px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);font-size:14px}
.inp:focus{border-color:var(--accent);outline:none}
.radio{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);width:100%;text-align:left}
.radio[aria-checked="true"]{border-color:var(--brand);background:var(--surface-2)}
.radio .dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center}
.radio[aria-checked="true"] .dot{border-color:var(--brand)}
.radio[aria-checked="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.radio .t{flex:1;min-width:0}
.radio b{display:block;font-size:13.5px}
.radio i{font-style:normal;font-size:11.5px;color:var(--ink-3)}
.bill{display:flex;flex-direction:column;gap:8px}
.bill .l{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2)}
.bill .l.total{font-size:16px;color:var(--ink);font-weight:700;font-family:Fraunces,Georgia,serif;padding-top:9px;border-top:1px solid var(--line-soft)}
.bill .l.disc{color:var(--ok)}

/* ---------- tracking ---------- */
.track{display:flex;gap:0;margin:6px 0 4px}
.track .s{flex:1;text-align:center;position:relative;font-size:10.5px;font-weight:700;color:var(--ink-3)}
.track .s .n{width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--ink-3);display:grid;place-items:center;margin:0 auto 6px;font-size:11px;position:relative;z-index:2;border:2px solid var(--bg)}
.track .s::before{content:"";position:absolute;top:11px;left:0;right:50%;height:2px;background:var(--line)}
.track .s::after{content:"";position:absolute;top:11px;left:50%;right:0;height:2px;background:var(--line)}
.track .s:first-child::before,.track .s:last-child::after{display:none}
.track .s.done{color:var(--ok)}
.track .s.done .n{background:var(--ok);color:#fff}
.track .s.done::before{background:var(--ok)}
.track .s.now{color:var(--accent)}
.track .s.now .n{background:var(--accent);color:var(--on-accent)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.feed li{display:flex;gap:10px;font-size:13px}
.feed li .tm{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none;width:56px;padding-top:1px}

/* ---------- admin ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:13px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.kpi .v{font-family:Fraunces,Georgia,serif;font-size:23px;font-weight:700;line-height:1.05}
.kpi .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-top:4px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:flex;align-items:center;gap:9px;font-size:12.5px}
.bar .lbl{width:72px;flex:none;color:var(--ink-2)}
.bar .t{flex:1;height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.bar .v{width:22px;text-align:right;font-weight:700}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:0 8px 7px 0;font-weight:700}
table.dt td{padding:8px 8px 8px 0;border-top:1px solid var(--line-soft);vertical-align:top}
.wa{background:var(--ok-bg);border-left:3px solid var(--ok);border-radius:0 11px 11px 0;padding:11px 13px;font-size:12.5px;color:var(--ink);line-height:1.5}
.wa b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);margin-bottom:5px}
pre.code{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.tree{font-family:var(--mono);font-size:12px;line-height:1.85;color:var(--ink-2);white-space:pre}

/* ---------- bottom nav ---------- */
.nav{display:flex;background:var(--surface);border-top:1px solid var(--line);flex:none;padding:6px 4px 8px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;font-size:10px;font-weight:600;color:var(--ink-3);border-radius:10px;position:relative}
.nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--nav-on)}
.nav .bdg{position:absolute;top:2px;right:calc(50% - 17px);min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--alert);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center}

/* ---------- install ---------- */
.qrbox{background:#fff;border-radius:14px;padding:14px;display:grid;place-items:center;border:1px solid var(--line)}
.qrbox canvas{display:block;width:100%;max-width:230px;height:auto;image-rendering:pixelated}
.steps{counter-reset:st;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.steps li{display:flex;gap:11px;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.steps li::before{counter-increment:st;content:counter(st);width:21px;height:21px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px;font-family:Karla,sans-serif}
.appicon{width:60px;height:60px;border-radius:15px;flex:none;box-shadow:var(--shadow)}

/* ---------- toast ---------- */

}

/* ============================== QR ENCODER (byte mode, v1-6, EC M/L) ============================== */
/* Minimal QR encoder — byte mode, versions 1-6, EC levels L and M. */
function qrMatrix(text, forceMask){
  const enc = new TextEncoder().encode(text), n = enc.length;
  const CAP = { M:[14,26,42,62,84,106], L:[17,32,53,78,106,134] };
  const BLK = { // version -> [ecPerBlock, [ [blocks, dataCw], ... ] ]
    M:[[10,[[1,16]]],[16,[[1,28]]],[26,[[1,44]]],[18,[[2,32]]],[24,[[2,43]]],[16,[[4,27]]]],
    L:[[7,[[1,19]]],[10,[[1,34]]],[15,[[1,55]]],[20,[[1,80]]],[26,[[1,108]]],[18,[[2,68]]]]
  };
  const ALIGN = [[],[6,18],[6,22],[6,26],[6,30],[6,34]];
  let ec=null, ver=0;
  for(const lvl of ["M","L"]){ for(let v=0;v<6;v++){ if(n<=CAP[lvl][v]){ ec=lvl; ver=v+1; break; } } if(ec) break; }
  if(!ec) return null;
  const size = 17 + ver*4;

  /* ---- bit stream ---- */
  const bits=[];
  const put=(val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>i)&1); };
  put(4,4); put(n,8);
  enc.forEach(b=>put(b,8));
  const [ecPer, groups] = BLK[ec][ver-1];
  const totalData = groups.reduce((a,[b,d])=>a+b*d,0);
  for(let i=0;i<4 && bits.length<totalData*8;i++) bits.push(0);
  while(bits.length%8) bits.push(0);
  const data=[]; for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j]; data.push(b); }

  function rsEncode(block,d){ const gen=rsPoly(d); const res=new Array(d).fill(0);
    for(const b of block){ const f=b^res[0]; res.shift(); res.push(0);

  groups.forEach(([cnt,dcw])=>{ for(let i=0;i<cnt;i++){ const blk=data.slice(off,off+dcw); off+=dcw;

  const maxD=Math.max(...dBlocks.map(b=>b.length));
  for(let i=0;i<maxD;i++) dBlocks.forEach(b=>{ if(i<b.length) final.push(b[i]); });
  for(let i=0;i<ecPer;i++) eBlocks.forEach(b=>final.push(b[i]));

  /* ---- matrix ---- */
  const m=Array.from({length:size},()=>new Array(size).fill(null));
  const set=(r,c,v)=>{ if(r>=0&&r<size&&c>=0&&c<size) m[r][c]=v; };
  const finder=(r,c)=>{ for(let i=-1;i<=7;i++) for(let j=-1;j<=7;j++){

  const ac=ALIGN[ver-1];
  for(const r of ac) for(const c of ac){
    if((r<=8&&c<=8)||(r<=8&&c>=size-9)||(r>=size-9&&c<=8)) continue;
    for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++)

  for(let i=8;i<size-8;i++){ if(m[6][i]===null) m[6][i]=i%2===0?1:0; if(m[i][6]===null) m[i][6]=i%2===0?1:0; }
  set(size-8,8,1);
  const reserved=(r,c)=> (r<9&&c<9)||(r<9&&c>=size-8)||(r>=size-8&&c<9);

  const bitStr=[]; final.forEach(b=>{ for(let i=7;i>=0;i--) bitStr.push((b>>i)&1); });
  let idx=0, up=true;
  for(let c=size-1;c>0;c-=2){ if(c===6) c--;
    for(let k=0;k<size;k++){ const r = up ? size-1-k : k;
      for(const cc of [c,c-1]) if(m[r][cc]===null && !reserved(r,cc)) m[r][cc] = idx<bitStr.length?bitStr[idx++]:0; }

  /* ---- mask + format ---- */
  const MASKS=[(r,c)=>(r+c)%2===0,(r,c)=>r%2===0,(r,c)=>c%3===0,(r,c)=>(r+c)%3===0,
    (r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0,(r,c)=>((r*c)%2+(r*c)%3)===0,
    (r,c)=>(((r*c)%2+(r*c)%3)%2)===0,(r,c)=>(((r+c)%2+(r*c)%3)%2)===0];
  function buildProper(mask){
    const g=m.map(row=>row.slice());
    const isFn=(r,c)=>{
      if(reserved(r,c)) return true;
      if(r===6||c===6) return true;
      for(const rr of ac) for(const cc of ac){
        if((rr<=8&&cc<=8)||(rr<=8&&cc>=size-9)||(rr>=size-9&&cc<=8)) continue;
        if(Math.abs(r-rr)<=2 && Math.abs(c-cc)<=2) return true; }
      return false; };
    for(let r=0;r<size;r++) for(let c=0;c<size;c++)
      if(!isFn(r,c) && MASKS[mask](r,c)) g[r][c]^=1;

      else if(i===8) g[8][7]=b; else g[8][14-i]=b;

    g[size-8][8]=1;
    return g; }
  function penalty(g){
    let p=0;
    for(let r=0;r<size;r++){ let run=1; for(let c=1;c<size;c++){ if(g[r][c]===g[r][c-1]) run++; else { if(run>=5)p+=3+run-5; run=1; } } if(run>=5)p+=3+run-5; }
    for(let c=0;c<size;c++){ let run=1; for(let r=1;r<size;r++){ if(g[r][c]===g[r-1][c]) run++; else { if(run>=5)p+=3+run-5; run=1; } } if(run>=5)p+=3+run-5; }
    for(let r=0;r<size-1;r++) for(let c=0;c<size-1;c++){ const v=g[r][c]; if(v===g[r][c+1]&&v===g[r+1][c]&&v===g[r+1][c+1]) p+=3; }
    let dark=0; g.forEach(row=>row.forEach(v=>dark+=v));

  let best=null,bp=Infinity;
  if(forceMask!==undefined) best=buildProper(forceMask);
  else for(let k=0;k<8;k++){ const g=buildProper(k), s=penalty(g); if(s<bp){bp=s;best=g;} }
  return { size, modules:best, version:ver, ec };
}

/* ============================== PWA ============================== */
let deferredPrompt = null;
const standalone = () => { try{ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }catch(e){ return false; } };
(function(){ try{
  const head = document.head;
  const meta = (n,c) => { const e=document.createElement("meta"); e.setAttribute("name",n); e.setAttribute("content",c); head.appendChild(e); };
  meta("theme-color","#123A2B");
  meta("apple-mobile-web-app-capable","yes");
  meta("apple-mobile-web-app-status-bar-style","black-translucent");
  meta("apple-mobile-web-app-title","SSS Catering");
  const ti=document.createElement("link"); ti.rel="apple-touch-icon"; ti.href=APP_ICON; head.appendChild(ti);
  if(head.querySelector('link[rel="manifest"]')) return;
  const mf={ name:"SSS Catering — Festival Orders", short_name:"SSS Catering",
    start_url:".", scope:".", display:"standalone", orientation:"portrait",
    background_color:"#F3F1E7", theme_color:"#123A2B",
    icons:[{src:APP_ICON, sizes:"192x192", type:"image/png", purpose:"any maskable"}] };
  const ml=document.createElement("link"); ml.rel="manifest";
  ml.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));
  head.appendChild(ml);
}catch(e){} })();
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e;
  if(state.screen==="install") render(); });
window.addEventListener("appinstalled", () => { deferredPrompt=null; toast("SSS Catering installed"); });

function platform(){
  const ua = navigator.userAgent || "";
  if(/iPhone|iPad|iPod/i.test(ua)) return "ios";
  if(/Android/i.test(ua)) return "android";
  return "desktop";
}

/* ============================== COMPONENTS ============================== */
function pillFor(f){
  const s = fstatus(f);
  return '<span class="pill dot '+s+'">'+STATUS_LABEL[s]+'</span>';
}
function festArt(f, cls){
  return '<div class="art '+(cls||"")+'" '+artStyle(f)+'><div class="glyph">'+f.glyph+'</div></div>';
}
function prodCard(p){
  const f = fest(p.fid), st = fstatus(f);
  const open = st==="open";
  return '<button class="card pcard" data-act="go" data-arg="product:'+p.id+'">'+
    festArt(f,"sm")+
    '<div class="body">'+
      '<h4>'+esc(p.name)+'</h4>'+
      '<div class="meta num">'+esc(p.serves)+' · '+esc(f.short)+'</div>'+
      '<div class="desc">'+esc(p.contents)+'</div>'+
      '<div class="foot"><span class="price num">'+INR(p.price)+'</span>'+
        (open
          ? '<span class="btn acc sm" style="margin-left:auto" data-act="add" data-arg="'+p.id+'">Add</span>'
          : '<span class="pill '+st+'" style="margin-left:auto">'+(st==="closed"?"Closed":st==="soon"?"Opens "+fmtShort(f.opens):"Planned")+'</span>')+
      '</div>'+
    '</div></button>';
}

/* ============================== SCREEN: HOME ============================== */
function scHome(){
  const dw = fest("diwali"), st = fstatus(dw);
  const upcoming = sortedFest().slice(0,6);
  const past = state.orders.filter(o=>o.stage>=4)[0] || state.orders[state.orders.length-1];
  const menuLinks = [
    ["Upcoming Festivals","menu"],["Diwali Specials","menu:fest:diwali"],["Ramzan Specials","menu:fest:ramzan"],
    ["Sweets Boxes","menu:cat:sweets"],["Savory Boxes","menu:cat:savory"],["Biryani & Meals","menu:cat:meals"],
    ["Corporate Gifting","menu:cat:corporate"],["Daily Tiffin","tiffin"]
  ];
  return ''+
  '<div class="banner art" '+artStyle(dw)+'>'+
    '<div class="kicker">'+(st==="open"?"Early bird live":"Featured festival")+'</div>'+
    '<h2>Diwali Early Bird — 15% Off till Oct 15</h2>'+
    '<button class="btn acc" data-act="go" data-arg="menu:fest:diwali">Order Now</button>'+
  '</div>'+

  '<div class="sechead"><h3>Upcoming Festivals</h3><a data-act="go" data-arg="menu">See all</a></div>'+
  '<div class="hscroll">'+ upcoming.map(f=>{
    const s = fstatus(f);
    const cta = s==="open" ? "Order Now" : s==="soon" ? "Notify Me" : s==="plan" ? "Notify Me" : "Notify Me";
    const act = s==="open" ? 'data-act="go" data-arg="menu:fest:'+f.id+'"' : 'data-act="notify" data-arg="'+f.id+'"';
    return '<div class="fbig">'+festArt(f)+
      '<div class="b"><h4>'+esc(f.short)+'</h4>'+
      '<div class="tiny">'+esc(f.dateLabel)+(f.theme?' · '+esc(f.theme):'')+'</div>'+
      pillFor(f)+
      '<div class="tiny" style="line-height:1.35">'+esc(statusLine(f))+'</div>'+
      '<button class="btn '+(s==="open"?"acc":"out")+' sm" style="width:100%;margin-top:auto" '+act+'>'+cta+'</button>'+
      '</div></div>';
  }).join("") + '</div>'+

  '<div class="sechead"><h3>Shop by</h3></div>'+
  '<div class="pad" style="padding-top:0"><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">'+
    menuLinks.map(([label,route])=>'<button class="card" style="padding:12px;text-align:left;font-weight:600;font-size:13.5px;line-height:1.25" data-act="'+(route==="tiffin"?"tiffin":"go")+'" data-arg="'+route+'">'+esc(label)+'</button>').join("")+
  '</div></div>'+

  (past ? '<div class="sechead"><h3>Quick Reorder</h3></div>'+
  '<div class="pad" style="padding-top:0"><div class="card pad row">'+
    festArt(fest(PROD[past.lines[0].pid].fid),"sm")+
    '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">'+esc(PROD[past.lines[0].pid].name)+'</div>'+
    '<div class="tiny">Ordered '+fmt(past.date)+' · '+INR(past.total)+'</div></div>'+
    '<button class="btn out sm" data-act="reorder" data-arg="'+past.id+'">Reorder</button>'+
  '</div></div>' : '')+

  (standalone() ? '' :
  '<div class="pad" style="padding-bottom:0"><button class="card pad row" style="width:100%;text-align:left;gap:12px" data-act="go" data-arg="install">'+
    '<img src="'+APP_ICON+'" alt="" style="width:44px;height:44px;border-radius:11px;flex:none">'+
    '<span style="flex:1;min-width:0"><b style="font-size:14px;display:block">Add SSS Catering to your phone</b>'+
    '<span class="tiny">Installs from this page — no Play Store, no App Store</span></span>'+
    '<span class="btn acc sm">Install</span></button></div>')+

  '<div class="sechead"><h3>Festival Calendar</h3></div>'+
  '<div class="pad" style="padding-top:0"><div class="card" style="padding:4px 14px">'+
    FEST.map((f,i)=>'<button style="display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 0;'+(i?'border-top:1px solid var(--line-soft)':'')+'" data-act="go" data-arg="menu:fest:'+f.id+'">'+
      '<span style="width:9px;height:9px;border-radius:3px;background:hsl('+f.hue+' 62% 45%);flex:none"></span>'+
      '<span style="flex:1;min-width:0"><b style="font-size:13.5px;display:block">'+esc(f.name)+'</b>'+
      '<span class="tiny">'+esc(f.dateLabel)+' · '+esc(f.strategy)+'</span></span>'+
      pillFor(f)+'</button>').join("")+
  '</div></div>'+
  '<div style="height:16px"></div>';
}

/* ============================== SCREEN: MENU ============================== */
function scMenu(){
  const p = state.param || "";
  if(p.startsWith("fest:")) return menuFest(fest(p.slice(5)));
  if(p.startsWith("cat:"))  return menuCat(p.slice(4));
  return menuIndex();
}
function head(title, back){
  return '<div class="phead">'+
    '<button class="ghost" data-act="go" data-arg="'+(back||"home")+'" aria-label="Back">'+svg("back")+'</button>'+
    '<h2>'+esc(title)+'</h2>'+
    '<button class="ghost" data-act="go" data-arg="menu" aria-label="Search menu">'+svg("search")+'</button>'+
  '</div>';
}
function menuIndex(){
  return head("Menu","home")+
  '<div class="sechead" style="padding-top:14px"><h3>By category</h3></div>'+
  '<div class="pad" style="padding-top:0;display:grid;grid-template-columns:1fr 1fr;gap:9px">'+
    Object.entries(CATS).map(([k,v])=>{
      const n = Object.values(PROD).filter(p=>p.cat===k).length;
      return '<button class="card" style="padding:13px;text-align:left" data-act="go" data-arg="menu:cat:'+k+'">'+
        '<div style="font-weight:700;font-size:13.5px">'+esc(v)+'</div><div class="tiny num">'+n+' item'+(n===1?"":"s")+'</div></button>';
    }).join("")+
  '</div>'+
  '<div class="sechead"><h3>By festival</h3></div>'+
  '<div class="pad" style="padding-top:0">'+
    sortedFest().map(f=>'<button class="card fcard" style="margin-bottom:10px;width:100%" data-act="go" data-arg="menu:fest:'+f.id+'">'+
      festArt(f,"sm")+
      '<div class="body"><h4>'+esc(f.name)+'</h4>'+
      '<div class="tiny" style="margin:2px 0 5px">'+esc(f.dateLabel)+' · '+(f.items.length?f.items.length+" combos":"menu planned")+'</div>'+
      pillFor(f)+'</div></button>').join("")+
  '</div>';
}
function menuFest(f){
  if(!f) return menuIndex();
  const st = fstatus(f);
  const cats = [...new Set(f.items.map(i=>i.cat))];
  const shown = state.filter==="all" ? f.items : f.items.filter(i=>i.cat===state.filter);
  return head(f.short+" Specials","menu")+
    (cats.length>1 ? '<div class="tabs">'+
      ['all',...cats].map(c=>'<button class="tab" aria-selected="'+(state.filter===c)+'" data-act="filter" data-arg="'+c+'">'+(c==="all"?"All":CATS[c])+'</button>').join("")+
    '</div>' : '')+
    '<div class="pad stack">'+
      '<div class="card" style="overflow:hidden">'+
        '<div class="art" style="--fh:'+f.hue+';height:100px"><div class="glyph">'+f.glyph+'</div></div>'+
        '<div class="pad stack" style="gap:8px">'+
          '<div class="row"><div style="flex:1"><div class="eyebrow">'+esc(f.dateLabel)+'</div>'+
          '<h3 style="font-size:18px">'+esc(f.name)+'</h3></div>'+pillFor(f)+'</div>'+
          (f.theme?'<div class="muted">Theme: '+esc(f.theme)+'</div>':'')+
          '<div class="notice '+(st==="open"?"good":st==="closed"?"bad":"warn")+'">'+

function coValid(){
  const b = bill();
  const codOK  = SETTINGS.cod && b.total <= SETTINGS.codLimit;
  const halfOK = !(SETTINGS.fullOnDelivery && state.co.method==="delivery");
  let pay = state.co.pay;
  if(pay==="cod"  && !codOK)  pay = halfOK ? "half" : "full";
  if(pay==="half" && !halfOK) pay = "full";
  const payNow = pay==="cod" ? 0 : pay==="half" ? Math.round(b.total/2) : b.total;
  const nameOK  = (state.co.name||"").trim().length >= 2;
  const phoneOK = (state.co.phone||"").replace(/\D/g,"").length === 10;
  const pickup  = state.co.method==="pickup";
  const addrOK  = pickup || (state.co.addr||"").trim().length >= 10;
  const pinOK2  = pickup || PINCODES.includes(state.co.pin);
  const blocked = cartFestivals().map(fest).filter(f => state.today > D(f.cutoff));
  const missing = !state.cart.length ? "Cart is empty"
    : !nameOK ? "Add your name" : !phoneOK ? "Add your number"
    : !addrOK ? "Add your address"
    : !pinOK2 ? ((state.co.pin||"").length<6 ? "Add your pincode" : "Pincode not serviceable") : null;
  return { b, codOK, halfOK, payNow, nameOK, phoneOK, addrOK, pinOK2, blocked, missing };
}
function cartCTA(){
  const v = coValid();
  return '<div style="flex:1"><div class="tiny">'+(v.payNow?"Pay now":"Pay on "+(state.co.method==="delivery"?"delivery":"pickup"))+'</div>'+
    '<b class="num" style="font-size:17px;font-family:Fraunces,Georgia,serif">'+INR(v.payNow||v.b.total)+'</b></div>'+
    (v.blocked.length || v.missing
      ? '<button class="btn" disabled style="width:auto;padding:12px 20px">'+(v.blocked.length?"Cut-off passed":v.missing)+'</button>'
      : '<button class="btn acc" style="width:auto;padding:12px 22px" data-act="place">'+(v.payNow?"Proceed to Pay":"Place Order")+'</button>');
}

function paintQR(){
  const box = $("#qrBox"), note = $("#qrNote"); if(!box) return;
  const url = (state.qrUrl||"").trim();
  box.innerHTML = "";
  if(!url){ box.innerHTML = '<div style="color:#8B9083;font-size:12px;text-align:center;padding:26px 8px">Your QR code appears here</div>'; return; }
  const r = qrMatrix(url);
  if(!r){ box.innerHTML = '<div style="color:#B03227;font-size:12px;text-align:center;padding:26px 8px">That address is too long for a QR code — a shorter domain will work</div>'; return; }
  const q = 4, scale = 8, dim = (r.size + q*2) * scale;
  const cv = document.createElement("canvas"); cv.width = cv.height = dim;
  cv.setAttribute("role","img"); cv.setAttribute("aria-label","QR code for "+url);
  const g = cv.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0,0,dim,dim);
  g.fillStyle = "#111111";
  for(let y=0;y<r.size;y++) for(let x=0;x<r.size;x++)
    if(r.modules[y][x]) g.fillRect((x+q)*scale, (y+q)*scale, scale, scale);
  box.appendChild(cv);
  if(note) note.textContent = "Version "+r.version+" · error correction "+r.ec+" · point any phone camera at it";
}

/* ============================== EVENTS ============================== */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act],[data-go]");
  if(!el) return;
  if(el.dataset.go){ go(el.dataset.go); return; }
  const act = el.dataset.act, arg = el.dataset.arg || "";
  const stop = ()=>{ e.preventDefault(); e.stopPropagation(); };

  if(act==="go"){ go(arg); }
  else if(act==="back"){ history.length; go(PROD[state.param] ? "menu:fest:"+PROD[state.param].fid : "menu"); }
  else if(act==="filter"){ state.filter = arg; render(); }
  else if(act==="admtab"){ state.adminTab = arg; render(); }
  else if(act==="tiffin"){ stop(); toast("Daily Tiffin has no menu in the sheet yet"); }
  else if(act==="notify"){ stop(); toast("We'll WhatsApp you when "+fest(arg).short+" opens"); }
  else if(act==="share"||act==="wish"){ toast(act==="wish"?"Saved to wishlist":"Share link copied"); }
  else if(act==="noop"){ toast("Opening WhatsApp support…"); }

  else if(act==="add"){
    stop();
    const p = PROD[arg];
    addToCart({ pid:p.id, size:0, opts:Object.fromEntries((p.options||[]).map(g=>[g.id,g.choices[0].v])), qty:1 });
    toast(p.name+" added");
    render();
  }
  else if(act==="size"){ state.draft.size = +arg; render(); }
  else if(act==="opt"){ const [g,v] = arg.split("|"); state.draft.opts[g] = v; render(); }
  else if(act==="pqty"){ state.draft.qty = Math.max(1, state.draft.qty + (+arg)); render(); }
  else if(act==="addcart"){
    addToCart({...state.draft, opts:{...state.draft.opts}});
    toast("Added to cart"); go("cart");
  }
  else if(act==="qty"){ const [i,d] = arg.split("|"); const l = state.cart[+i];
    l.qty += (+d); if(l.qty<1) state.cart.splice(+i,1); render(); }
  else if(act==="rm"){ stop(); state.cart.splice(+arg,1); render(); }
  else if(act==="method"){ state.co.method = arg; if(arg==="delivery") state.co.pay="full"; render(); }
  else if(act==="slot"){ state.co.slot = arg; render(); }
  else if(act==="pay"){ if(el.hasAttribute("disabled")) return; state.co.pay = arg; render(); }
  else if(act==="applycpn"){ const v = ($("#cpnInp")||{}).value || ""; state.co.coupon = v.toUpperCase().trim();
    render(); toast(COUPONS[state.co.coupon] ? "Coupon applied" : "Invalid code"); }
  else if(act==="usecpn"){ state.co.coupon = arg; toast(arg+" applied to cart"); go("cart"); }
  else if(act==="place"){ placeOrder(); }
  else if(act==="advance"){ const o = state.orders.find(x=>x.id===arg); if(o&&o.stage<4){ o.stage++;
      toast("WhatsApp sent: "+(o.stage>=4?"order delivered":STAGES[Math.min(o.stage,3)])); render(); } }
  else if(act==="reorder"){ stop(); const o = state.orders.find(x=>x.id===arg);
    o.lines.forEach(l=>addToCart({...l, opts:{...l.opts}}));
    toast("Items added to cart"); go("cart"); }
  else if(act==="realdate"){ state.today = todayLocal(); state.dateOverride=false; state.co.date=null; render(); toast("Back to today"); }
  else if(act==="doinstall"){
    if(!deferredPrompt){ toast("Use the steps below for your phone"); return; }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(r=>{ deferredPrompt=null;
      toast(r && r.outcome==="accepted" ? "Installing…" : "Install dismissed"); render(); });
  }
  else if(act==="admtabgo"){ state.adminTab = arg; go("admin"); }
  else if(act==="copywa"){ const ta = $("#waTxt"); if(ta){ ta.select();
      try{ navigator.clipboard.writeText(ta.value); }catch(err){ try{ document.execCommand("copy"); }catch(e2){} }
      toast("Order summary copied"); } }
  else if(act==="codcap"){ SETTINGS.codLimit = +arg; render(); toast("COD cap set to "+(+arg>99999?"no limit":INR(+arg))); }
  else if(act==="toggle"){ SETTINGS[arg] = !SETTINGS[arg]; render();
      toast(arg==="cod" ? (SETTINGS.cod?"Cash on delivery ON":"Cash on delivery OFF") : "Setting updated"); }
  else if(act==="clearorders"){ state.cart=[]; state.orders=[]; state.co.coupon=""; state.co.date=null;
    toast("Order history on this device cleared"); go("home"); }
});

document.addEventListener("input", e=>{
  const t = e.target;
  if(t.id==="pinInp"){ state.co.pin = t.value.replace(/\D/g,"").slice(0,6);
    const tip = t.parentElement.querySelector(".tiny"); if(tip){
      const ok = PINCODES.includes(state.co.pin);
      tip.style.color = ok ? "var(--ok)" : "var(--alert)";
      tip.textContent = state.co.pin.length<6 ? "Enter your 6-digit pincode" : ok ? "✓ We deliver to "+state.co.pin : "✕ Not serviceable yet — pickup available";
    }
    save(); refreshCTA(); }
  else if(t.id==="addrInp"){ state.co.addr = t.value; save(); refreshCTA(); }
  else if(t.id==="nameInp"){ state.co.name = t.value; save(); refreshCTA(); }
  else if(t.id==="qrUrl"){ state.qrUrl = t.value; paintQR(); }
  else if(t.id==="acName"){ state.co.name = t.value; save(); }
  else if(t.id==="acAddr"){ state.co.addr = t.value; save(); }
  else if(t.id==="acPhone"){ const v=t.value.replace(/\D/g,"").slice(0,10); if(v!==t.value) t.value=v; state.co.phone=v; save(); }
  else if(t.id==="acPin"){ const v=t.value.replace(/\D/g,"").slice(0,6); if(v!==t.value) t.value=v; state.co.pin=v; save(); }
  else if(t.id==="phoneInp"){
    const v = t.value.replace(/\D/g,"").slice(0,10);
    if(v!==t.value) t.value = v;
    state.co.phone = v; save();
    const tip = t.parentElement.querySelector(".tiny");
    if(tip){ const now = v.length===10;
      tip.style.color = now?"var(--ok)":"var(--ink-3)";
      tip.textContent = now?"✓ Confirmation and updates come here":"We send order updates on WhatsApp"; }
    refreshCTA();
  }
  else if(t.id==="cpnInp"){ state.co.coupon = t.value.toUpperCase(); }
});
document.addEventListener("change", e=>{
  if(e.target.id==="coDate"){ state.co.date = e.target.value; render(); }
  if(e.target.id==="simDate"){ state.today = D(e.target.value); state.dateOverride = true; state.co.date=null; render(); }
});
$("#cartBtn").addEventListener("click", ()=>go("cart"));
$("#acctBtn").addEventListener("click", ()=>go("account"));

/* ============================== WHATSAPP ============================== */
function waMessage(o){
  const b = o.bill || {sub:o.total, del:0, disc:0, pct:0};
  const L = [];
  L.push("*NEW ORDER  #"+o.id+"*");
  L.push("SSS Catering — festival pre-order");
  L.push("");
  L.push("*Customer:* "+(o.name||"—"));
  L.push("*WhatsApp:* +91 "+(o.phone||"—"));
  L.push("");
  L.push("*Items*");
  o.lines.forEach(l=>{
    const p = PROD[l.pid];
    const opt = Object.values(l.opts||{}).filter(Boolean).join(", ");
    L.push("• "+p.name+" ("+(p.sizes?p.sizes[l.size].label:p.serves)+")"+(opt?" — "+opt:"")+" × "+l.qty+" = "+INR(unitPrice(l)*l.qty));
  });
  L.push("");
  L.push("*"+(o.method==="delivery"?"Delivery":"Pickup")+":* "+fmt(o.date)+", "+o.slot);
  L.push("*"+(o.method==="delivery"?"Address":"Store")+":* "+o.addr);
  L.push("");
  L.push("Subtotal: "+INR(b.sub));
  L.push("Delivery: "+(b.del?INR(b.del):"Free"));
  if(b.disc) L.push("Discount ("+b.pct+"%): -"+INR(b.disc));
  L.push("*Total: "+INR(o.total)+"*");
  L.push("*Payment:* "+PAYLABEL[o.payMode||"full"]);
  L.push(o.paid ? "Paid now: "+INR(o.paid)+(o.paid<o.total?"  |  Balance on "+(o.method==="delivery"?"delivery":"pickup")+": "+INR(o.total-o.paid):"")
                : "*To collect on "+(o.method==="delivery"?"delivery":"pickup")+": "+INR(o.total)+"*");
  return L.join("\n");
}
const waLink = txt => "https://wa.me/"+SETTINGS.waNumber+"?text="+encodeURIComponent(txt);

/* ============================== ACTIONS ============================== */
function addToCart(line){
  const key = l => l.pid+"|"+l.size+"|"+JSON.stringify(l.opts||{});
  const ex = state.cart.find(l=>key(l)===key(line));
  if(ex) ex.qty += line.qty; else state.cart.push(line);
}
function placeOrder(){
  const b = bill();
  const f = fest(PROD[state.cart[0].pid].fid);
  const id = f.short.replace(/[^A-Za-z]/g,"").slice(0,3).toUpperCase() + Math.floor(1000+Math.random()*8999);
  const paid = state.co.pay==="cod" ? 0 : state.co.pay==="half" ? Math.round(b.total/2) : b.total;
  state.orders.push({
    id, placed:iso(state.today), lines:state.cart.map(l=>({...l})),
    date:state.co.date, slot:state.co.slot, method:state.co.method,
    addr: state.co.method==="delivery" ? state.co.addr : STORE,
    name:state.co.name, phone:state.co.phone,
    total:b.total, paid, payMode:state.co.pay,
    bill:{sub:b.sub, del:b.del, disc:b.disc, pct:b.pct},
    stage:0, coupon: state.co.coupon || null, fresh:true
  });
  state.cart = []; state.co.coupon=""; state.co.date=null;
  toast(paid ? "Payment received — order "+id+" confirmed" : "Order "+id+" placed — pay on "+(state.co.method==="delivery"?"delivery":"pickup"));
  go("order:"+id);
}

render();
</script>

  });
}
